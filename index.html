<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1d1b20;--mu:#6b6670;--ac:#e8453c;--ln:#e6e0d8;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151a;--card:#232027;--tx:#f3eff6;--mu:#a29cab;--ln:#37323d}}
:root[data-theme="dark"]{--bg:#17151a;--card:#232027;--tx:#f3eff6;--mu:#a29cab;--ln:#37323d}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:14px 0}
input,select{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin:6px 0}
button{font:inherit;font-weight:600;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;margin:6px 0}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
button:disabled{opacity:.4}
