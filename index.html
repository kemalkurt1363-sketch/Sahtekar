<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1d1b20;--mu:#6b6670;--ac:#e8453c;--ln:#e6e0d8;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17151a;--card:#232027;--tx:#f3eff6;--mu:#a29cab;--ln:#37323d}}
:root[data-theme="dark"]{--bg:#17151a;--card:#232027;--tx:#f3eff6;--mu:#a29cab;--ln:#37323d}
html{color-scheme:light dark;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:28px;margin:8px 0 4px}h2{font-size:20px;margin:0 0 10px}
.mu{color:var(--mu);font-size:14px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px;margin:14px 0}
input,select{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);margin:6px 0}
button{font:inherit;font-weight:600;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;margin:6px 0}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
button:disabled{opacity:.4}
.code{font-size:44px;letter-spacing:8px;text-align:center;font-weight:800;margin:4px 0}
.pl{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--ln)}
.pl:last-child{border:0}
.secret{user-select:none;-webkit-user-select:none;text-align:center;padding:26px 10px;border-radius:14px;background:var(--bg);border:2px dashed var(--ln);font-size:24px;font-weight:800;touch-action:none}
.me{color:var(--ac);font-weight:700}
.vote{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
.vote.on{background:var(--ac);color:#fff}
.big{font-size:26px;font-weight:800;text-align:center}
.chip{display:inline-block;width:auto;padding:8px 14px;margin:4px 4px 0 0;border-radius:20px;font-size:14px}
.chip.on{background:var(--ac);color:#fff;border:1px solid var(--ac)}
.chip.off{background:var(--card);color:var(--mu);border:1px solid var(--ln)}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:8px}
.top .chip{margin:0}
.who{display:flex;align-items:center;gap:8px;font-weight:700}
.av{border-radius:50%;object-fit:cover;vertical-align:middle;flex:none}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0}
.avb{width:auto;padding:3px;margin:0;background:var(--bg);border:2px solid transparent;border-radius:50%}
.avb.sel{border-color:var(--ac)}
</style></head><body><div id="app"></div>
