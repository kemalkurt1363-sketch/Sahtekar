    if(to===me.id){msg="Bu senin kendi kodun.";return render()}

}

async function pickWord(){
  const ref=R().collection("secret").doc("used");
  const sn=await ref.get();
  const st=sn.exists?sn.data():{};
  st.used=st.used||{};st.seen=st.seen||[];
  const sel=ui.cats.filter(c=>WORDS[c]);
  const avail=c=>WORDS[c].filter(e=>!(st.used[c]||[]).includes(e.split("|")[0]));
  let notes=[];
  let cand=sel.filter(c=>avail(c).length>0&&!st.seen.includes(c));
  if(!cand.length){st.seen=[];cand=sel.filter(c=>avail(c).length>0)}
  if(!cand.length){
    sel.forEach(c=>st.used[c]=[]);st.seen=[];cand=sel.slice();
    notes.push(sel.length===1?sel[0]+" kategorisindeki kelimeler bitti, baştan başlıyoruz.":"Seçili kategorilerdeki kelimeler bitti, baştan başlıyoruz.");
  }
  const cat=rnd(cand),entry=rnd(avail(cat));
  st.used[cat]=(st.used[cat]||[]).concat(entry.split("|")[0]);
  st.seen=st.seen.concat(cat);
  if(avail(cat).length===0&&!notes.length)notes.push(sel.length===1?cat+" kategorisindeki son kelime bu tur çıktı. Sonraki tur baştan başlar.":cat+" kategorisinde kelime kalmadı, sonraki turlarda atlanacak.");
  await ref.set(st);
  return {cat,entry,note:notes.join(" ")};
}

async function start(){
  try{
    if(!ui.cats.length){err="En az bir kategori seç.";return render()}
    const pk=await pickWord(),cat=pk.cat,entry=pk.entry.split("|"),word=entry[0],order=shuffle(players.map(p=>p.id)),imp=rnd(order),g=room.g+1;
    HS={g,w:word,alt:entry,imp};
    const b=db.batch();
    players.forEach(p=>b.set(R().collection("cards").doc(p.id),{g,t:p.id===imp?"imp":"word",w:p.id===imp?"":word}));
    b.set(R().collection("secret").doc("word"),{g,w:word,alt:entry,imp});
    await b.commit();
    await R().update({phase:"clue",g,cat,order,turn:0,lim:order.length*2,vr:0,ct:Number(ui.ct),vt:Number(ui.vt),result:null,guess:null,word:null,imp:null,cats:ui.cats.slice(),note:pk.note||""});
  }catch(e){err="Başlatılamadı: "+(e.message||e.code);render()}
}
async function advanceClue(turn,text){
  const ref=R();
  await db.runTransaction(async t=>{
    const sn=await t.get(ref),d=sn.data();
    if(!d||d.phase!=="clue"||d.turn!==turn)return;
    const uid=d.order[turn%d.order.length];
    t.set(ref.collection("clues").doc(d.g+"_"+turn),{g:d.g,turn,uid,text});
    const next=turn+1;
    t.update(ref,next>=(d.lim||d.order.length*2)?{phase:"vote",turn:next}:{turn:next});
  });
}
async function sendClue(){
  const t=(ui.clue||"").trim();
  if(!t||room.phase!=="clue"||room.order[room.turn%room.order.length]!==me.id)return;
  const turn=room.turn;ui.clue="";
  try{await advanceClue(turn,t)}catch(e){err="Gönderilemedi: "+(e.message||e.code);render()}
}

async function hostSecret(){
  if(HS&&HS.g===room.g)return HS;
  const s=await R().collection("secret").doc("word").get();HS=s.exists?s.data():null;return HS;
}
function hostWatch(){
  if(!room||room.host!==me.id)return;
  if(room.phase==="vote")checkVotes();
  else if(room.phase==="guess"&&room.guess!=null)checkGuess();
}
async function checkVotes(force){
  const vr=room.vr||0,key=room.g+"_"+vr;
  const v=votes.filter(x=>x.g===room.g&&(x.vr||0)===vr);
  if((!force&&v.length<players.length)||players.length<1||finG===key)return;
  finG=key;
  const tally={};v.forEach(x=>tally[x.target]=(tally[x.target]||0)+1);
  const top=Object.keys(tally).sort((a,b)=>tally[b]-tally[a]);
  const tie=top.length>1&&tally[top[0]]===tally[top[1]];
  try{
    if(tie&&vr<2){await R().update({phase:"clue",lim:(room.lim||room.order.length*2)+room.order.length,vr:vr+1});return}
    const accused=tie?null:top[0],hs=await hostSecret();
    if(accused&&accused===hs.imp)await R().update({phase:"guess",result:{tally,accused}});
    else await finish({tally,accused},false,"");
  }catch(e){err="Hata: "+(e.message||e.code);render()}
}
async function checkGuess(){
  if(finGu===room.g)return;finGu=room.g;
  try{const hs=await hostSecret();await finish(room.result,accepts(room.guess,hs),room.guess)}
  catch(e){err="Hata: "+(e.message||e.code);render()}
}
async function finish(result,guessOk,guess){
  const hs=await hostSecret();
  const caught=!!result.accused&&result.accused===hs.imp;
  const sc=Object.assign({},room.scores||{}),gain={};
  players.forEach(p=>{let g=0;
    if(p.id===hs.imp)g=!caught?2:(guessOk?1:0);else g=caught?1:0;
    gain[p.id]=g;sc[p.id]=(sc[p.id]||0)+g});
  await R().update({phase:"result",result:{tally:result.tally,accused:result.accused||null,gain,guess:guess||"",guessOk:!!guessOk},word:hs.w,imp:hs.imp,scores:sc});
}

          h+=`<div class="card"><div class="big">${r.accused?esc(nameOf(r.accused))+" suçlandı":(Object.keys(r.tally||{}).length?"Oylar eşit!":"Süre doldu, kimse oy vermedi")}</div><p class="big" style="color:${caught?"var(--ok)":"var(--ac)"}">${crewWon?"Sahtekâr yakalandı 🎉":caught?"Yakalandı ama kelimeyi bildi 😮 Sahtekâr da 1 puan aldı":"Sahtekâr kaçtı 😈"}</p>
          <div class="pl"><span>Sahtekâr</span><b>${pn(room.imp)}</b></div><div class="pl"><span>Kelime</span><b>${esc(room.word||"?")}</b></div>${caught?`<div class="pl"><span>Sahtekârın tahmini</span><b>${esc(r.guess||"-")}</b></div>`:""}
          ${Object.keys(r.tally||{}).map(k=>`<div class="pl"><span class="mu">${pn(k,20)}</span><span class="mu">${esc(r.tally[k])} oy</span></div>`).join("")}</div>`+lbCard()+(host?`<button data-on="again">Yeni tur</button>`:`<p class="mu" style="text-align:center">Kurucu yeni turu başlatacak.</p>`);
        }
      }
    }
    if(err)h+=E;
  }
  if(user&&loaded&&scr!=="setup")h=banner()+h;
  a.innerHTML=h;bind();tick();
  if(keep){const el=document.querySelector(`[data-m="${keep}"]`);if(el&&el.tagName==="INPUT"){el.focus();const l=el.value.length;try{el.setSelectionRange(l,l)}catch(e){}}}
}
function syncCd(){
  let lim=0,key="";
  if(room&&room.phase==="clue"){lim=room.ct||0;key=room.g+"|c|"+room.turn+"|"+(room.vr||0)}
  else if(room&&room.phase==="vote"){lim=room.vt||0;key=room.g+"|v|"+(room.vr||0)}
  if(key!==cd.key){cd={key,end:lim?Date.now()+lim*1000:0,done:false};ui.clue=""}
}
async function expire(){
  try{
    if(room.phase==="clue")await advanceClue(room.turn,"—");
    else if(room.phase==="vote")await checkVotes(true);
  }catch(e){}
}
function tick(){
  if(!db||!code||!room)return;
  syncCd();
  const el=$("#cd");
  if(!cd.end){if(el)el.textContent="";return}
  const left=Math.ceil((cd.end-Date.now())/1000);
  if(el){el.textContent="⏱ "+Math.max(left,0);el.style.color=left<=5?"var(--ac)":"var(--mu)"}
  if(room.host===me.id&&left<=-1&&!cd.done){cd.done=true;expire()}
}
setInterval(tick,250);
init();
</script></body></html>
